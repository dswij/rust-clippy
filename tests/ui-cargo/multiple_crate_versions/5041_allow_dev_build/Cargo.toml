# Should not lint for dev or build dependencies. See issue 5041.

[package]
name = "multiple-crate-versions"
version = "0.1.0"
publish = false

[workspace]

# One of the versions of winapi is only a dev dependency: allowed
[dependencies]
serde = "1.0.110"
[dev-dependencies]
ansi_term = "=0.11.0"

# Both versions of winapi are a build dependency: allowed
[build-dependencies]
serde = "1.0.110"
ansi_term = "=0.11.0"

[lints.cargo]
unused_dependencies = "allow"
